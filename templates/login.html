
{% extends 'base_modern.html' %}
{% block content %}
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f2f4f8;
    padding: 24px;
  }
  .login-card {
    width: min(100%, 420px);
    background: rgba(255,255,255,0.92);
    border: 1px solid #dfe6ef;
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(17, 24, 39, 0.08);
    padding: 28px 24px 20px;
  }
  .login-title {
    text-align: center;
    font-size: 2rem;
    font-weight: 800;
    margin: 0 0 20px;
    color: #1d2d3d;
  }
  .login-form .form-control {
    height: 46px;
    border-radius: 10px;
    border: 1px solid #d7deea;
    background: #f9fbfd;
  }
  .login-form .form-label {
    font-weight: 600;
    color: #49586b;
    margin-bottom: 8px;
  }
  .login-btn {
    width: 100%;
    background: linear-gradient(180deg, #1d76e5 0%, #1659b8 100%);
    border: none;
    border-radius: 10px;
    height: 44px;
    font-weight: 700;
  }
  .login-meta {
    text-align: right;
    font-size: 12px;
    color: #6b7280;
    margin-top: 10px;
  }
</style>
<div class="login-wrap">
  <div class="login-card">
    <h4 class="login-title">Masuk ke Jasa AC</h4>
    <form method="post" class="login-form">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input class="form-control" name="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" required>
      </div>
      <button class="btn btn-primary login-btn">Login</button>
      <div class="login-meta">Default: admin / admin</div>
    </form>
  </div>
</div>
{% endblock %}
