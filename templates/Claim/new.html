{% extends "base_modern.html" %}
{% block content %}
<div class="card shadow-sm p-4">
  <h4><i class="bi bi-flag"></i> Tambah Klaim untuk {{ customer.nama }}</h4>
  <p><strong>Unit:</strong> {{ unit.merk }} ({{ unit.pk }} PK)</p>
  <p><strong>Service:</strong> {{ service.tanggal }} — {{ service.jenis_service }}</p>

  <form method="post" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label">Deskripsi Klaim</label>
      <textarea name="deskripsi" class="form-control" rows="3" required></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Foto (opsional)</label>
      <input type="file" name="foto" class="form-control">
    </div>
    <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Simpan Klaim</button>
    <a href="{{ url_for('customers') }}" class="btn btn-secondary">Batal</a>
  </form>
</div>
{% endblock %}
