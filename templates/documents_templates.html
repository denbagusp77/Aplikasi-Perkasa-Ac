{% extends 'base_modern.html' %}
{% block content %}
<div class="doc-page">
  <div class="doc-topbar">
    <div>
      <p class="doc-subtitle">Dokumen &amp; Template</p>
      <h1 class="doc-title">Template Dokumen</h1>
    </div>
    <a href="{{ url_for('documents') }}" class="btn btn-back">Kembali</a>
  </div>

  <div class="panel-card form-panel">
    <div class="section-header"><i class="bi bi-file-earmark-richtext"></i> Template Tersedia</div>
    <div class="row g-3">
      {% for t in templates %}
      <div class="col-md-6">
        <div class="card h-100 border-0 shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <strong>{{ t.name }}</strong>
              <span class="badge bg-primary-subtle text-primary">{{ t.format }}</span>
            </div>
            <small class="text-muted">Terakhir diperbarui: {{ t.updated_at }}</small>
            <div class="mt-3">
              <button class="btn btn-sm btn-outline-primary">Gunakan Template</button>
            </div>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
