{% extends 'base_modern.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3><i class="bi bi-qr-code"></i> QR Absen — {{ employee.nama }}</h3>
  <a href="{{ url_for('employees') }}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left"></i> Kembali
  </a>
</div>

<div class="card shadow-sm text-center p-4">
  <div class="card-body">
    <p>Scan QR di bawah ini untuk melakukan absensi:</p>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data={{ qr_url }}" 
         alt="QR Absen {{ employee.nama }}" class="mb-3">

    <p><strong>{{ employee.nama }}</strong><br>
    {{ employee.jabatan or '-' }} — {{ employee.team or '-' }}</p>
  </div>
</div>
{% endblock %}
