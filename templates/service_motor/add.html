{% extends "base_modern.html" %}
{% block content %}
<h4 class="mb-3">Tambah Service Motor</h4>

<form method="POST">
  <div class="mb-3">
    <label class="form-label">Tanggal</label>
    <input type="date" name="tanggal" class="form-control" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Teknisi</label>
    <select name="technician_id" class="form-select" required>
      <option value="">-- Pilih Teknisi --</option>
      {% for t in technicians %}
        <option value="{{ t.id }}">{{ t.nama }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Total Biaya (Rp)</label>
    <input type="number" step="0.01" name="total_biaya" class="form-control" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Keterangan</label>
    <textarea name="keterangan" class="form-control"></textarea>
  </div>

  <button type="submit" class="btn btn-success">Simpan</button>
  <a href="{{ url_for('service_motor_list') }}" class="btn btn-secondary">Kembali</a>
</form>
{% endblock %}
