{% extends 'base_modern.html' %}

{% block content %}
<div class="container mt-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3><i class="bi bi-pencil"></i> Edit Absensi</h3>
    <a href="{{ url_for('attendance_report') }}" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left"></i> Kembali
    </a>
  </div>

  <div class="card shadow-sm rounded-3">
    <div class="card-body">
      <form method="POST" action="{{ url_for('attendance_edit', id=record.id) }}">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Nama Karyawan</label>
            <select name="technician_id" class="form-select" disabled>
              {% for t in technicians %}
                <option value="{{ t.id }}" {% if t.id == record.technician_id %}selected{% endif %}>{{ t.nama }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Tanggal</label>
            <input type="date" name="tanggal" class="form-control" value="{{ record.tanggal.strftime('%Y-%m-%d') if record.tanggal else '' }}" required>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Jam Masuk</label>
            <input type="time" name="jam_masuk" class="form-control" value="{{ record.jam_masuk.strftime('%H:%M') if record.jam_masuk else '' }}">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Jam Pulang</label>
            <input type="time" name="jam_pulang" class="form-control" value="{{ record.jam_pulang.strftime('%H:%M') if record.jam_pulang else '' }}">
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
              <option value="Hadir" {% if record.status == 'Hadir' %}selected{% endif %}>Hadir</option>
              <option value="Izin" {% if record.status == 'Izin' %}selected{% endif %}>Izin</option>
              <option value="Sakit" {% if record.status == 'Sakit' %}selected{% endif %}>Sakit</option>
              <option value="Alpa" {% if record.status == 'Alpa' %}selected{% endif %}>Alpa</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Keterangan</label>
            <input type="text" name="keterangan" class="form-control" value="{{ record.keterangan or '' }}">
          </div>
        </div>

        <div class="text-end">
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-save"></i> Simpan Perubahan
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
