{% extends "base_modern.html" %}
{% block content %}

<div class="container mt-4">
  <h3><i class="bi bi-gear"></i> Pengaturan Payroll per Karyawan</h3>

  <!-- Form Pilih Karyawan -->
  <form method="get" class="mt-3 mb-4">
    <div class="row g-2 align-items-center">
      <div class="col-md-6">
        <label for="employee_id" class="form-label">Pilih Karyawan</label>
        <select name="employee_id" id="employee_id" class="form-select" onchange="this.form.submit()">
          <option value="">-- Pilih Karyawan --</option>
          {% for emp in employees %}
            <option value="{{ emp.id }}" {% if selected_employee and emp.id == selected_employee.id %}selected{% endif %}>
              {{ emp.nama }}
            </option>
          {% endfor %}
        </select>
      </div>
    </div>
  </form>

  {% if selected_employee %}
  <!-- Form Pengaturan Karyawan -->
  <form method="POST">
    <input type="hidden" name="employee_id" value="{{ selected_employee.id }}">
    <div class="row g-3">
      <div class="col-md-6">
        <label>Gaji Pokok</label>
        <input type="number" step="any" id="gaji_pokok" name="gaji_pokok" class="form-control" 
               value="{{ setting.gaji_pokok if setting else (selected_employee.gaji_pokok or 0) }}">
      </div>
      <div class="col-md-6">
        <label>Bonus Bulanan</label>
        <input type="number" step="any" name="bonus_bulanan" class="form-control"
               value="{{ setting.bonus_bulanan if setting else 0 }}">
      </div>
      <div class="col-md-6">
        <label>Uang Makan Harian</label>
        <input type="number" step="any" name="uang_makan_harian" class="form-control"
               value="{{ setting.uang_makan_harian if setting else 0 }}">
      </div>
      <div class="col-md-6">
        <label>Uang Bensin Harian</label>
        <input type="number" step="any" name="uang_bensin_harian" class="form-control"
               value="{{ setting.uang_bensin_harian if setting else 0 }}">
      </div>
      

    <div class="mt-4">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-save"></i> Simpan Pengaturan
      </button>
      <a href="{{ url_for('payroll_settings') }}" class="btn btn-secondary ms-2">Kembali</a>
    </div>
  </form>
  {% endif %}
</div>

<!-- 🔹 Script untuk update otomatis potongan absen -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  const gajiInput = document.getElementById('gaji_pokok');
  const potonganInput = document.getElementById('potongan_absen_per_hari');

  if (gajiInput) {
    gajiInput.addEventListener('input', () => {
      const gaji = parseFloat(gajiInput.value || 0);
      potonganInput.value = (gaji / 26).toFixed(0);
    });
  }
});
</script>

{% endblock %}
