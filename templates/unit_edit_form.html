{% extends "base_modern.html" %}
{% block content %}

<h4><i class="bi bi-pencil-square"></i> Edit Unit — {{ customer.nama }}</h4>

<form method="POST" class="card p-4 shadow-sm">

  <div class="mb-3">
    <label class="form-label">Nama Ruangan</label>
    <input type="text" name="ruangan" class="form-control" value="{{ unit.ruangan }}">
  </div>

  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">Merk</label>
      <input type="text" name="merk" class="form-control" value="{{ unit.merk }}">
    </div>

    <div class="col-md-4 mb-3">
      <label class="form-label">PK</label>
      <input type="text" name="pk" class="form-control" value="{{ unit.pk }}">
    </div>

    <div class="col-md-4 mb-3">
      <label class="form-label">Jumlah Unit</label>
      <input type="number" name="jumlah_unit" class="form-control" value="{{ unit.jumlah_unit }}">
    </div>
  </div>

  <div class="d-flex justify-content-between">
    <a href="{{ url_for('units', cid=unit.customer_id) }}" class="btn btn-secondary">
      <i class="bi bi-arrow-left"></i> Kembali
    </a>

    <button type="submit" class="btn btn-primary">
      <i class="bi bi-save"></i> Simpan Perubahan
    </button>
  </div>

</form>

{% endblock %}
